name: Tests

on:
  schedule:
    - cron: '19 5 * * *'  # UTC
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: LabelKit daneben holen (Wischproben-Listen vergleichen)
        run: git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/labelkit.git ../labelkit
      - name: Probenbezeichnung (ohne Browser)
        run: node tests/konventionen.cjs
        env:
          LABELKIT_PFLICHT: '1'
      - name: Hilfe-Adressen der Apps vorhanden
        run: node tests/hilfe-anker.cjs
      - name: Install Playwright (pinned, not part of the repository)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Handbuch im Browser
        run: node tests/aidkit-browser.cjs chromium
